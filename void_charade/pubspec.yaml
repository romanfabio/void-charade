name: void_charade
description: "Void Charade - offline forehead charades party game."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  auto_size_text: ^3.0.0
  sensors_plus: ^7.1.1
  wakelock_plus: ^1.8.1
  audioplayers: ^6.8.1
  vibration: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/categories.json
    - assets/LICENSE.txt
    - assets/words/en/
    - assets/words/it/
    - assets/sounds/
    - assets/branding/logo.png
    - assets/fonts/OFL-LilitaOne.txt
    - assets/fonts/OFL-Nunito.txt

  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
